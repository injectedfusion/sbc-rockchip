name: dtb-turingrk1
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base

steps:
  - sources:
      # The DTB MUST be compiled from the SAME 6.1 vendor BSP tree as the kernel, not mainline.
      # Mainline 6.18.2 and the BSP number the RK3588 CRU clocks differently, so a mainline
      # DTB's <&cru CLKID> phandles resolve to the wrong clocks under the 6.1 kernel -> the
      # RK3588 power-controller (fd8d8000) cannot get its domains' clocks -> EPROBE_DEFER (-517)
      # forever -> GMAC + VPU + PCIe + PHYs never probe. Same tag + hashes as the kernel
      # (talos-rk1-vpu linux_bsp_sha256/sha512).
      - url: https://github.com/Joshua-Riek/linux-rockchip/archive/refs/tags/Ubuntu-rockchip-6.1.0-1027.27.tar.gz
        destination: linux.tar.gz
        sha256: "4f4518c0f6a5ed40a1baa9bacfc1de50bca06091520e467735da6c4e312d6cd4"
        sha512: "1d35bde0e8c0b0acc19f26cf2165560247f325961fde0e5d38534a40137018b54621fc1894fa7176cc01ee750e50f4f2ae5181056264494e708e22e0ae673666"

    prepare:
      - |
        tar -xzf linux.tar.gz --strip-components=1
        rm linux.tar.gz
      - |
        # Physical debug console: the Turing Pi 2 "UART2 DEBUG" pin header (per node slot)
        # is wired to the RK1's uart2 via the uart2m0 mux (mainline rk3588-turing-rk1.dtsi
        # enables exactly this; the BSP DTS sets the serial2 alias but leaves uart2 disabled).
        # Talos already boots with console=ttyS2,115200 on the cmdline, so enabling the node
        # mirrors the kernel console to the physical header: lossless, bmcd-independent
        # capture with any 3.3V USB-TTL cable. Appended (not context-patched) so it survives
        # upstream drift in the BSP DTS.
        cat >> arch/arm64/boot/dts/rockchip/rk3588-turing-rk1.dts <<'EOF'

        &uart2 {
        	pinctrl-names = "default";
        	pinctrl-0 = <&uart2m0_xfer>;
        	status = "okay";
        };
        EOF
      - |
        for patch in $(find /pkg/patches -type f -name "*.patch" | sort); do
          echo "Applying patch $patch"
          patch -p1 < $patch || (echo "Failed to apply patch $patch" && exit 1)
        done

    build:
      - |
          cpp -nostdinc -I include -I arch  -undef -x assembler-with-cpp  arch/arm64/boot/dts/rockchip/rk3588-turing-rk1.dts rk3588-turing-rk1.dts.preprocessed
          dtc -O dtb -o rk3588-turing-rk1.dtb rk3588-turing-rk1.dts.preprocessed

    install:
      - |
        mkdir -p /rootfs/dtb/rockchip

        mv rk3588-turing-rk1.dtb /rootfs/dtb/rockchip/rk3588-turing-rk1.dtb
finalize:
  - from: /rootfs
    to: /